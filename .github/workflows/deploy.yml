name: CI/CD

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t atlas-backend:${{ github.sha }} -f app/Dockerfile app/

      - name: Load image into kind
        run: kind load docker-image atlas-backend:${{ github.sha }} --name devops-test

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Set image
        run: kubectl set image deployment/backend backend=atlas-backend:${{ github.sha }} -n atlas

      - name: Wait for rollout
        run: kubectl rollout status deployment/backend -n atlas --timeout=90s
